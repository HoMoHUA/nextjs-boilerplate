server {
    listen 80;
    listen [::]:80;
    server_name office.arklyn.ir;
    location /.well-known/acme-challenge/ { root /var/www/office.arklyn.ir; }
    location / { return 301 https://office.arklyn.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name office.arklyn.ir;
    ssl_certificate /etc/letsencrypt/live/office.arklyn.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.arklyn.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host office.arklyn.ir;
        proxy_set_header X-Forwarded-Host office.arklyn.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
